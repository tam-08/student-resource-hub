<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Resource Hub </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="item1"> 
            
            <div class="item1-sidebar">
                <h2 class="logo"> 📚 StudentHub </h2>
                <button class="btn-upload"> Tải file lên </button>
                <ul class="nav-menu"> 
                    <li class="active"> Tài liệu của tôi </li>
                    <li> Đã chia sẻ </li>
                    <li> Yêu thích </li>
                    <li> Thùng rác </li>
                </ul>
            </div>

        </div>
        <div class="item2">
            <div class="header"> 
                <h3> Thanh công cụ  </h3>
            </div>

            <div class="main-content">
                <h2> Tài liệu của tôi </h2>

                <div class="file-grid">

                    <div class="file-card">

                        <div class="file-icon"> 📄 </div>

                        <div class="file-name"> Tài liệu 1 </div>
                    </div>

                    <div class="file-card">

                        <div class="file-icon"> 📁 </div>

                        <div class="file-name"> Tài liệu 2 </div>
                    </div>


                    <div class="file-card">

                        <div class="file-icon"> 🖼️ </div>

                        <div class="file-name"> Tài liệu 3 </div>
                    </div>

                </div>

            </div>
        </div>
    </div>
</body>
</html>
